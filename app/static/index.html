<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diacritizare Română</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Source+Sans+3:wght@400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background: #fafaf8;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2.5rem 1rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      display: block;
      margin-bottom: 0.4rem;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 0.8rem 1rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #c8a96e; }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.75rem;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #333; }
    button:disabled { background: #aaa; cursor: not-allowed; }

    hr { border: none; border-top: 1px solid #e0ddd6; margin: 2rem 0; }

    .result-box {
      background: #fff;
      border: 1px solid #e0ddd6;
      border-left: 4px solid #c8a96e;
      border-radius: 6px;
      padding: 1rem 1.2rem;
      font-size: 1.05rem;
      line-height: 1.7;
      min-height: 3rem;
      word-wrap: break-word;
    }

    /* Inline highlight for characters the model/postprocessor changed */
    mark.change-highlight {
      background: #fdf1d5;
      color: #5a4a2a;
      padding: 0 1px;
      border-radius: 2px;
      font-weight: 600;
    }

    .placeholder { color: #aaa; font-style: italic; }

    .cols { display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; margin-top: 1.5rem; }

    .section-label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .confidence-value {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .confidence-high   { color: #2e7d32; }
    .confidence-medium { color: #e65100; }
    .confidence-low    { color: #c62828; }

    .confidence-note {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 0.3rem;
    }

    .change-item {
      background: #fdf6ec;
      border: 1px solid #e8d8b8;
      border-radius: 4px;
      padding: 0.35rem 0.7rem;
      font-size: 0.85rem;
      font-family: 'Courier New', monospace;
      color: #5a4a2a;
      margin-bottom: 0.35rem;
    }

    .warning-item {
      background: #fff8ec;
      border: 1px solid #f0c060;
      border-radius: 4px;
      padding: 0.35rem 0.7rem;
      font-size: 0.85rem;
      color: #7a5a10;
      margin-bottom: 0.35rem;
    }

    .error-box {
      background: #fff0ee;
      border: 1px solid #f5b5ad;
      border-left: 4px solid #c62828;
      border-radius: 6px;
      padding: 1rem 1.2rem;
      color: #7a1f1f;
      font-size: 0.95rem;
      margin-top: 1rem;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.8rem;
      color: #bbb;
    }

    #results, #error { display: none; }
  </style>
</head>
<body>
  <div class="container">

    <h1>Diacritizare Română</h1>
    <p class="subtitle">Restaurare automată a diacriticelor pentru texte în limba română</p>

    <label for="inputText">Text de intrare</label>
    <textarea
      id="inputText"
      placeholder="Introduceți textul fără diacritice sau cu diacritice greșite..."
    ></textarea>

    <button id="btn" onclick="run()">Diacritizează</button>

    <div id="error" class="error-box"></div>

    <div id="results">
      <hr />

      <label>Text corectat</label>
      <div class="result-box" id="outputText"></div>

      <div class="cols">
        <div>
          <div class="section-label">Scor de încredere</div>
          <div class="confidence-value" id="confidenceValue"></div>
          <div class="confidence-note" id="confidenceNote"></div>
        </div>
        <div>
          <div class="section-label">Modificări aplicate</div>
          <div id="changesList"></div>
        </div>
      </div>
    </div>

    <footer>Diacritizare robustă și detecție de diacritice greșite</footer>

  </div>

  <script>

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // Wrap each character whose index is in `positions` with a <mark> tag.
    function highlightChanges(text, positions) {
      if (!positions || positions.length === 0) return escapeHtml(text);
      const set = new Set(positions);
      let out = "";
      for (let i = 0; i < text.length; i++) {
        const ch = escapeHtml(text[i]);
        if (set.has(i)) {
          out += `<mark class="change-highlight">${ch}</mark>`;
        } else {
          out += ch;
        }
      }
      return out;
    }

    function classifyConfidence(score) {
      if (score >= 0.95) return { cls: "confidence-high",   label: "ridicată" };
      if (score >= 0.80) return { cls: "confidence-medium", label: "medie"    };
      return              { cls: "confidence-low",    label: "scăzută"  };
    }

    function showError(msg) {
      const el = document.getElementById("error");
      el.textContent = msg;
      el.style.display = "block";
      document.getElementById("results").style.display = "none";
    }

    function hideError() {
      document.getElementById("error").style.display = "none";
    }

    async function run() {
      const inputEl = document.getElementById("inputText");
      const btn = document.getElementById("btn");
      const input = inputEl.value.trim();

      hideError();

      if (!input) {
        showError("Introduceți un text înainte de a continua.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Se procesează...";

      try {
        const resp = await fetch("/restore", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: input }),
        });

        if (!resp.ok) {
          let msg = `Eroare ${resp.status}`;
          try {
            const err = await resp.json();
            if (err && err.detail) msg = err.detail;
          } catch (_) { /* ignore parse errors */ }
          showError(msg);
          return;
        }

        const data = await resp.json();
        render(data);
      } catch (e) {
        showError("Eroare de rețea: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Diacritizează";
      }
    }

    function render(data) {
      // Restored text with inline highlighted changes
      document.getElementById("outputText").innerHTML =
        highlightChanges(data.restored, data.changed_positions);

      const conf = classifyConfidence(data.confidence);
      const confEl = document.getElementById("confidenceValue");
      confEl.textContent = `${(data.confidence * 100).toFixed(1)}% (${conf.label})`;
      confEl.className = "confidence-value " + conf.cls;

      document.getElementById("confidenceNote").textContent =
        `${data.changed_positions.length} caracter${data.changed_positions.length === 1 ? "" : "e"} modificat${data.changed_positions.length === 1 ? "" : "e"} · ${data.elapsed_ms.toFixed(0)} ms`;

      // Changes list: a summary row for model edits, plus post-processor rows.
      const changesList = document.getElementById("changesList");
      const rows = [];

      if (data.changed_positions.length > 0) {
        rows.push(
          `<div class="change-item">Modelul a modificat ${data.changed_positions.length} poziți${data.changed_positions.length === 1 ? "e" : "i"}</div>`
        );
      }
      for (const change of (data.postprocessing_changes || [])) {
        const cls = change.startsWith("WARNING") ? "warning-item" : "change-item";
        rows.push(`<div class="${cls}">${escapeHtml(change)}</div>`);
      }
      if (rows.length === 0) {
        rows.push('<div class="change-item placeholder">— nicio modificare</div>');
      }

      changesList.innerHTML = rows.join("");
      document.getElementById("results").style.display = "block";
    }
  </script>
</body>
</html>
